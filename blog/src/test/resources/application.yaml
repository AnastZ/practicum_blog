spring:
  application:
    name: blog

  datasource:
    url: ${DB_URL:jdbc:h2:mem:blog;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
post:
  image:
    path: classpath:images/post/